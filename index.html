<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oche Darts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: scorebord naast de oche. Spelers links, bord in het midden, invoer rechts. Bewust één donker thema (bordzwart + sisal + messing). */
:root{
  --bg:#101311; --panel:#181d19; --panel2:#1f2520; --line:#2c342e;
  --fg:#efe8d6; --muted:#a5a08c; --gold:#e1ae4a; --red:#cf3a2d; --green:#2f8b51;
  --cream:#e7dcc0; --black:#141414; --wire:#b9b6aa;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.06em;line-height:1}
.brand span{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:600}
nav button.on{background:var(--panel2);color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok i{background:var(--green)} .chip.warn i{background:var(--gold)} .chip.bad i{background:var(--red)}
.spacer{flex:1}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.03em;margin:0 0 12px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:#1b1505;border-color:var(--gold)}
.btn.danger{color:#ff9d92}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.gcard{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.gcard b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:.03em}
.gcard span{font-size:13px;color:var(--muted);line-height:1.35}
.gcard.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.stack{display:flex;flex-direction:column;gap:14px}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px) minmax(0,1fr);gap:16px;align-items:start}
.players{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pcard.out{opacity:.55}
.pname{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:17px}
.pname small{font-weight:500;color:var(--muted);font-size:13px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,7vw,96px);line-height:.9;letter-spacing:.01em}
.pcard.on .big{color:var(--gold)}
.sub{color:var(--muted);font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{border:1px dashed var(--line);border-radius:8px;padding:6px;text-align:center;font-weight:700;min-height:34px}
.slot.f{border-style:solid;background:var(--panel2)}
.hist{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.hint{min-height:42px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.03em;text-align:center}
.msg{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--gold);text-align:center;min-height:0}
.boardwrap{position:relative}
.boardwrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.pad{display:flex;flex-direction:column;gap:10px}
.mult{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mult button,.keys button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 0;font-weight:700;font-size:17px}
.mult button.on{background:var(--fg);color:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys button:active{background:var(--line)}
.keys .wide{grid-column:span 2}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.camthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.camthumbs canvas{width:100%;border-radius:6px;background:#000;display:block}
.dstate{font-size:14px;color:var(--muted)}
table.ct{width:100%;border-collapse:collapse;font-weight:700}
table.ct td,table.ct th{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.ct th{font-family:var(--f-display);font-size:22px}
table.ct td.dead{color:var(--line)}
.mk{width:22px;height:22px;vertical-align:middle}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,7,6,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov .box{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.win{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--gold);line-height:1;margin:0 0 6px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tw{overflow-x:auto}

/* cams */
.cams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.cam canvas.view{width:100%;display:block;background:#000;border-radius:8px;cursor:crosshair;touch-action:none}
.camhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.camhead b{font-family:var(--f-display);font-size:24px;font-weight:800}
.camctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.camctrl .full{grid-column:1/-1}
.instr{min-height:40px;font-size:14px;margin-top:8px}
.instr b{color:var(--gold)}
.setgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel2);border-radius:10px;padding:12px}
.tile b{display:block;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30}
.plist{display:flex;flex-direction:column;gap:8px;max-width:620px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1}


/* game: beweging */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gtitle{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em}
.gtitle span{font-family:var(--f-body);font-size:15px;font-weight:500;letter-spacing:0;margin-left:8px}
.pcard{transition:transform .35s ease,border-color .35s,box-shadow .35s,opacity .35s,background .35s}
.pcard.on{transform:scale(1.015);background:linear-gradient(180deg,#232a24,var(--panel))}
.pcard .big{transition:font-size .35s ease,color .35s}
.pcard:not(.on) .big{font-size:clamp(40px,4.4vw,64px);color:var(--muted)}
.pcard.enter{animation:enter .5s ease-out}
@keyframes enter{0%{box-shadow:0 0 0 0 rgba(225,174,74,.7)}100%{box-shadow:0 0 0 14px rgba(225,174,74,0)}}
.slot{display:flex;flex-direction:column;justify-content:center;line-height:1.05}
.slot b{font-size:18px}.slot small{font-size:12px;color:var(--muted);font-weight:600}
.slot.pop{animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.spark{width:100%;height:30px;display:block}
.route{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:48px}
.rchip{padding:4px 16px;border-radius:99px;border:2px solid var(--gold);color:var(--gold);font-family:var(--f-display);font-weight:800;font-size:26px;animation:pop .3s ease-out}
.rchip:first-child{background:var(--gold);color:#1b1505}
.rtext{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.02em}
.callout{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.callout span{font-family:var(--f-display);font-weight:800;font-size:clamp(80px,13vw,170px);line-height:1;color:var(--fg);text-shadow:0 6px 40px rgba(0,0,0,.9);animation:call 1.4s ease-out forwards}
.callout .high{color:var(--gold)}
.callout .max{color:var(--gold);animation:callmax 1.9s ease-out forwards}
.callout .bust{color:var(--red);animation:shake 1.4s ease-out forwards}
.callout .miss{color:var(--muted);font-size:clamp(50px,8vw,90px)}
@keyframes call{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.08);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes callmax{0%{transform:scale(.3) rotate(-6deg);opacity:0}12%{transform:scale(1.25) rotate(2deg);opacity:1}25%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}
@keyframes shake{0%{transform:translateX(0);opacity:0}8%{opacity:1}15%,45%{transform:translateX(-14px)}30%,60%{transform:translateX(14px)}70%{transform:translateX(0);opacity:1}100%{opacity:0}}
.flash{animation:flash .85s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.btn.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(225,174,74,.35)}}
:fullscreen main{max-width:none}



.code{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:.12em;color:var(--gold)}
.rvid{position:relative;width:100%;margin-top:8px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.rvid video{width:100%;height:100%;object-fit:cover;display:block}
.guestturn .rvid{aspect-ratio:auto;height:min(42vh,520px)}
.selfcam{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:240px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:2px solid var(--gold);background:#000;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.selfcam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.selfcam span{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:5px}
.selfcam .ib{position:absolute;right:2px;top:0;width:28px;height:28px;font-size:18px;color:#fff;background:rgba(0,0,0,.35)}
.ownv{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
.ownv .rvid{margin-top:0}
.ownv .rvid.face{aspect-ratio:16/9}
.ownv .rvid.face video{transform:scaleX(-1)}
.ownv .rvid:not(.face){aspect-ratio:1/1;max-width:340px;margin:0 auto}
#ownboard{object-fit:contain;transition:transform .3s}
.rvid em{position:absolute;left:8px;bottom:6px;font-style:normal;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:5px}
.rvid span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
/* wedstrijdscherm */
#groot{display:flex;flex-direction:column;gap:14px}
.mtop{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start}
.mleft{display:flex;flex-direction:column;gap:10px;min-width:0}
.back{background:none;border:0;font-weight:600;font-size:17px;padding:4px 0;text-align:left;color:var(--fg)}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchips span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--muted)}
.mright{display:flex;justify-content:flex-end;gap:6px}
.ib{background:none;border:0;font-size:20px;color:var(--fg);width:40px;height:40px;border-radius:8px}
.ib:hover{background:var(--panel2)}
.turnbar{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:76px;cursor:pointer}
.tb-darts{display:grid;grid-template-columns:repeat(3,110px);align-items:center;padding:0 14px}
.tbs{display:flex;justify-content:center;align-items:center;color:var(--line);height:100%}
.tbs svg{width:64px;height:16px}
.tbs b{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--fg);letter-spacing:.02em}
.tbs.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.tb-sum{border-left:1px solid var(--line);min-width:110px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:46px;padding:0 18px}
.tb-sum.bust{color:var(--red)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,min(560px,calc(100vh - 260px))) minmax(0,1fr);gap:18px;align-items:center}
.mcenter .boardwrap{max-width:min(560px,calc(100vh - 260px))}
.mcenter{display:flex;flex-direction:column;gap:8px;align-items:center}
.camst{display:flex;align-items:center;gap:10px;align-self:flex-start}
.cambtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:700;color:var(--muted)}
.cambtn.on{border-color:var(--gold);color:var(--fg)}
.boardwrap.glow{width:100%;border-radius:50%;box-shadow:0 0 0 3px rgba(225,174,74,.55),0 0 46px rgba(225,174,74,.22)}
.pc{position:relative;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:transform .35s ease,background .35s,opacity .35s}
.pc-in{padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pc.on{background:linear-gradient(150deg,#3a2f14 0%,#2a2416 45%,var(--panel) 100%);border-color:var(--gold);transform:translateY(-4px)}
.pc.out{opacity:.55}
.pc.enter{animation:enter .5s ease-out}
.pc-name{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:99px;padding:4px 16px 4px 4px;max-width:100%}
.pc-name .dot{width:8px;height:8px;border-radius:50%;background:transparent;margin-left:6px}
.pc.on .pc-name .dot{background:var(--gold)}
.pc-name .av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1b1505;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.pc-name .nm{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-name .tag{color:var(--gold);font-weight:700}
.pc-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;width:100%}
.co{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.co span{background:var(--panel2);border:1px solid var(--line);color:var(--gold);font-family:var(--f-display);font-weight:800;font-size:22px;padding:4px 12px;border-radius:8px;animation:pop .3s ease-out}
.pc .big{font-size:clamp(70px,8.5vw,140px);color:var(--fg);text-align:center}
.pc:not(.on) .big{color:var(--muted);font-size:clamp(70px,8.5vw,140px)}
.legs{background:var(--bg);border-radius:8px;padding:4px 12px;font-family:var(--f-display);font-weight:800;font-size:26px;justify-self:start}
.pc-sub{font-size:20px;color:var(--fg);text-align:center}
.pc-sub b{font-weight:700}
.pc-darts{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:600}
.pc .spark{opacity:.8}
.pc .hist{justify-content:center}
.prog{height:6px;background:var(--panel2)}
.prog i{display:block;height:100%;background:var(--gold);transition:width .6s ease;width:0}
.pc-side{align-self:start}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.drawer summary{cursor:pointer;font-weight:600;color:var(--muted)}
.drawer .pad{margin-top:10px}
.drawer .keys{grid-template-columns:repeat(12,1fr)}
.drawer .keys .wide{grid-column:span 2}
.drawer .ctrl{max-width:520px}
.drawer .mult{max-width:520px}
.drawer .keys button{padding:9px 0}
.drawer .camthumbs{max-width:520px}
@media (max-width:1100px){.mrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mcenter{grid-column:1/-1;order:-1;max-width:520px;margin:0 auto;width:100%}
  .mtop{grid-template-columns:1fr;justify-items:center}.mleft{align-items:center}.mright{position:absolute;right:16px}.drawer .keys{grid-template-columns:repeat(6,1fr)}}
@media (max-width:640px){.tb-darts{grid-template-columns:repeat(3,70px)}.tbs b{font-size:24px}.tb-sum{font-size:34px;min-width:70px}.mrow{grid-template-columns:1fr}}

@media (max-width:1100px){
  .game{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .game .center{grid-column:1/-1;order:-1;max-width:560px;margin:0 auto;width:100%}
}
@media (max-width:760px){
  .setup,.game,.setgrid,.sgrid{grid-template-columns:minmax(0,1fr)}
  .big{font-size:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">OCHE<span>.</span></div>
  <nav id="nav">
    <button data-v="play" class="on">Spelen</button>
    <button data-v="cams">Camera's</button>
    <button data-v="stats">Statistieken</button>
    <button data-v="players">Spelers</button>
  </nav>
  <div class="spacer"></div>
  <span class="chip" id="camchip"><i></i><span>Camera's uit</span></span>
</header>
<main>
  <section id="v-play"></section>
  <section id="v-cams" hidden></section>
  <section id="v-stats" hidden></section>
  <section id="v-players" hidden></section>
</main>
<div id="overlay"></div>

<script>
/*ENGINE START*/
// ---------- Bord-geometrie (mm, y omhoog) ----------
const SECT=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const RB={bi:6.35,bo:15.9,ti:99,to:107,di:162,do:170};
function scoreAt(x,y){
  const r=Math.hypot(x,y);
  if(r<=RB.bi) return {n:25,m:2};
  if(r<=RB.bo) return {n:25,m:1};
  if(r>RB.do) return {n:0,m:0};
  const a=Math.atan2(y,x)*180/Math.PI;
  let i=Math.round((90-a)/18); i=((i%20)+20)%20;
  const m=(r>=RB.ti&&r<=RB.to)?3:(r>=RB.di)?2:1;
  return {n:SECT[i],m};
}
function segPoint(n,m){
  if(!m) return [0,200];
  if(n===25) return m===2?[0,0]:[0,11];
  const i=SECT.indexOf(n), a=(90-i*18)*Math.PI/180;
  const r=m===3?103:m===2?166:135;
  return [r*Math.cos(a),r*Math.sin(a)];
}
function lbl(d){ if(!d||!d.m) return 'Miss'; if(d.n===25) return d.m===2?'Bull':'25'; return (d.m===3?'T':d.m===2?'D':'S')+d.n; }
const val=d=>d.n*d.m;
function rng(seed){ let a=seed>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}; }

// ---------- Uitgooi-suggesties ----------
function oneDart(rem,out){
  if(rem<=0) return false;
  const dbl=(rem<=40&&rem%2===0)||rem===50;
  if(out==='double') return dbl;
  if(out==='master') return dbl||(rem<=60&&rem%3===0);
  return rem<=20||rem===25||dbl||(rem<=60&&rem%3===0);
}
const THROWS=(()=>{const a=[];for(let n=20;n>=1;n--)a.push({n,m:3});a.push({n:25,m:2});for(let n=20;n>=1;n--)a.push({n,m:1});a.push({n:25,m:1});for(let n=20;n>=1;n--)a.push({n,m:2});return a})();
const DPREF=[20,16,8,10,18,12,4,14,6,2,19,17,15,13,11,9,7,5,3,1,25];
const COMEMO={};
function checkout(rem,darts,out){
  if(darts<1||rem<1) return null;
  const key=rem+'|'+darts+'|'+out; if(key in COMEMO) return COMEMO[key];
  const fin=out==='straight'?t=>t.m>0:out==='master'?t=>t.m>=2:t=>t.m===2;
  const rank=t=>t.m===2?DPREF.indexOf(t.n):30+THROWS.indexOf(t);
  const F=THROWS.filter(fin);
  let best=null,bc=null;
  const consider=(arr)=>{const last=arr[arr.length-1];const c=[rank(last),arr.reduce((s,t)=>s+THROWS.indexOf(t),0)];if(!best||c[0]<bc[0]||(c[0]===bc[0]&&c[1]<bc[1])){best=arr;bc=c}};
  for(let k=1;k<=darts&&!best;k++){
    if(k===1){for(const f of F) if(val(f)===rem) consider([f]);}
    else if(k===2){for(const a of THROWS){const r=rem-val(a);if(r<1)continue;for(const f of F) if(val(f)===r) consider([a,f]);}}
    else {for(const a of THROWS){const r1=rem-val(a);if(r1<2)continue;for(const b of THROWS){const r2=r1-val(b);if(r2<1)continue;for(const f of F) if(val(f)===r2) consider([a,b,f]);}}}
  }
  COMEMO[key]=best; return best;
}

// ---------- Spel-engines ----------
function base(pl){
  return {players:pl.map(p=>({id:p.id,name:p.name,out:false,elim:false})),cur:0,over:false,winner:null,td:0,done:false,
    turnNo:0,darts:[],tdarts:[],tpts:0,msg:'',next:null,stat:pl.map(()=>({darts:0})),hist:pl.map(()=>[])};
}
function eBegin(G,st){st.td=0;st.done=false;st.tdarts=[];st.tpts=0;st.msg='';st.next=null;G.begin&&G.begin(st);}
function eDart(G,st,d){
  if(st.over||st.done) return;
  st.tdarts.push(d);st.td++;st.tpts+=val(d);
  const s=st.stat[st.cur]; s.darts=(s.darts||0)+1;
  st.darts.push({p:st.cur,n:d.n,m:d.m,x:d.x,y:d.y});
  G.dart(st,d);
  if(st.td>=3) st.done=true;
}
function eEnd(G,st){
  if(st.over) return;
  G.end&&G.end(st); st.turnNo++;
  if(st.over) return;
  if(st.next!=null){st.cur=st.next;return;}
  const n=st.players.length;
  for(let i=1;i<=n;i++){const c=(st.cur+i)%n;if(!st.players[c].out){st.cur=c;return;}}
  st.over=true;
  if(G.final) G.final(st); else bestBy(st,p=>p.score);
}
function bestBy(st,f){let b=0;st.players.forEach((p,i)=>{if(f(p)>f(st.players[b]))b=i});st.winner=b;}
const optRounds=(d,list)=>({k:'rounds',l:'Rondes',v:list,d});

GAMES.x01={name:'X01',desc:'301, 501 of meer precies naar nul. Legs, double-in en -out instelbaar.',min:1,
  opts:[{k:'start',l:'Startscore',v:[101,170,201,301,501,701,901,1001,1501],d:501},
    {k:'in',l:'Inmaken',v:[['straight','Straight in'],['double','Double in'],['master','Master in']],d:'straight'},
    {k:'out',l:'Uitmaken',v:[['double','Double out'],['master','Master out'],['straight','Straight out']],d:'double'},
    {k:'legs',l:'Legs (first to)',v:[1,2,3,4,5,6,7,9,11],d:1}],
  create(pl,o){const st=base(pl);st.o=o;st.legStart=0;st.legNo=1;
    st.players.forEach(p=>{p.score=+o.start;p.in=o.in==='straight';p.legs=0;p.ld=0;p.lp=0});
    st.stat=pl.map(()=>({darts:0,pts:0,f9d:0,f9p:0,s180:0,s140:0,s100:0,hiCo:0,coAtt:0,coHit:0,legs:0,best:0}));return st},
  begin(st){const p=st.players[st.cur];st.ts=p.score;st.tin=p.in;st.sc=0;st.tf9=0;st.bust=false;st.leg=false},
  dart(st,d){const o=st.o,p=st.players[st.cur],s=st.stat[st.cur],v=val(d);
    if(p.in&&oneDart(p.score,o.out)) s.coAtt++;
    p.ld++; const f9=p.ld<=9; if(f9) s.f9d++;
    if(!p.in){ if(o.in==='double'?d.m===2:d.m>=2) p.in=true; else return; }
    const ns=p.score-v; const okOut=o.out==='straight'||(o.out==='double'?d.m===2:d.m>=2);
    if(ns<0||(ns===0&&!okOut)||(ns===1&&o.out!=='straight')){
      p.score=st.ts;p.in=st.tin;p.lp-=st.sc;s.pts-=st.sc;s.f9p-=st.tf9;st.sc=0;st.tf9=0;st.bust=true;st.done=true;st.msg='Bust';return;}
    p.score=ns;s.pts+=v;st.sc+=v;p.lp+=v;if(f9){s.f9p+=v;st.tf9+=v}
    if(ns===0){s.coHit++;s.hiCo=Math.max(s.hiCo,st.ts);p.legs++;s.legs++;s.best=s.best?Math.min(s.best,p.ld):p.ld;
      st.done=true;st.leg=true;st.msg='Game shot';
      if(p.legs>=+o.legs){st.over=true;st.winner=st.cur;}}
  },
  end(st){const s=st.stat[st.cur];
    if(!st.bust){const t=st.sc;if(t===180)s.s180++;else if(t>=140)s.s140++;else if(t>=100)s.s100++;}
    st.hist[st.cur].push(st.bust?'Bust':String(st.sc));
    if(st.leg){const n=st.players.length;st.legStart=(st.legStart+1)%n;st.legNo++;
      st.players.forEach(q=>{q.score=+st.o.start;q.in=st.o.in==='straight';q.ld=0;q.lp=0});st.next=st.legStart;}
  },
  big:(st,i)=>st.players[i].score,
  sub(st,i){const s=st.stat[i];return 'Gem. '+avg3(s.pts,s.darts)+(+st.o.legs>1?' · Legs '+st.players[i].legs:'')},
  sugg(st){const p=st.players[st.cur],o=st.o;if(!p.in||st.done)return null;
    return p.score<=(o.out==='straight'?180:170)?checkout(p.score,3-st.td,o.out):null},
  hint(st){const p=st.players[st.cur];if(!p.in)return st.o.in==='double'?'Begin met een dubbel':'Begin met een dubbel of triple';
    const c=this.sugg(st);return c?'Uitgooi: '+c.map(lbl).join(' · '):(+st.o.legs>1?'Leg '+st.legNo:'')},
  targets(st){const c=this.sugg(st);return c?[{n:c[0].n,m:c[0].m}]:[]},
  sum(st,i){return Object.assign({},st.stat[i],{score:st.players[i].score})}
};
function avg3(p,d){return d?(p/d*3).toFixed(1):'0.0'}

function cricketGame(name,desc,nums){return {name,desc,min:1,
  opts:[{k:'mode',l:'Variant',v:[['std','Standaard'],['cut','Cut-throat'],['none','Zonder punten']],d:'std'},
    {k:'rounds',l:'Max. rondes',v:[[0,'Onbeperkt'],10,15,20,25],d:20}],
  create(pl,o){const st=base(pl);st.o=o;st.nums=nums;
    st.players.forEach(p=>{p.marks={};nums.forEach(n=>p.marks[n]=0);p.score=0;p.turns=0});
    st.stat=pl.map(()=>({darts:0,marks:0}));return st},
  begin(st){st.tm=0},
  dart(st,d){if(!d.m||!st.nums.includes(d.n))return;const p=st.players[st.cur];st.stat[st.cur].marks+=d.m;st.tm+=d.m;
    const use=Math.min(d.m,Math.max(0,3-p.marks[d.n]));p.marks[d.n]+=use;const extra=d.m-use;
    if(extra>0&&st.o.mode!=='none'){const opp=st.players.filter((q,j)=>j!==st.cur&&q.marks[d.n]<3);
      if(opp.length){if(st.o.mode==='std')p.score+=extra*d.n;else opp.forEach(q=>q.score+=extra*d.n);}}
    const closed=st.nums.every(n=>p.marks[n]>=3);
    if(closed){const others=st.players.filter((q,j)=>j!==st.cur);
      const ok=st.o.mode==='none'||!others.length||(st.o.mode==='std'?others.every(q=>p.score>=q.score):others.every(q=>p.score<=q.score));
      if(ok){st.over=true;st.winner=st.cur;st.done=true;st.msg='Gewonnen';}}},
  end(st){const p=st.players[st.cur];p.turns++;st.hist[st.cur].push(st.tm+'×');
    const R=+st.o.rounds;if(R&&st.players.every(q=>q.turns>=R)){st.over=true;
      const mk=q=>st.nums.reduce((s,n)=>s+Math.min(3,q.marks[n]),0);
      if(st.o.mode==='cut')bestBy(st,q=>-q.score*1000+mk(q));else if(st.o.mode==='std')bestBy(st,q=>q.score*1000+mk(q));else bestBy(st,mk);}},
  big:(st,i)=>st.o.mode==='none'?st.nums.reduce((s,n)=>s+Math.min(3,st.players[i].marks[n]),0)+'/'+st.nums.length*3:st.players[i].score,
  sub(st,i){const s=st.stat[i];return 'MPR '+(s.darts?(s.marks/s.darts*3).toFixed(2):'0.00')+(+st.o.rounds?' · Ronde '+Math.min(st.players[i].turns+1,+st.o.rounds)+'/'+st.o.rounds:'')},
  hint(st){return ''},
  targets(st){const p=st.players[st.cur];return st.nums.filter(n=>p.marks[n]<3).map(n=>({n,m:0}))},
  panel(st){let h='<table class="ct"><tr><td></td>'+st.players.map(p=>'<td>'+esc(p.name)+'</td>').join('')+'</tr>';
    for(const n of st.nums){const dead=st.players.every(p=>p.marks[n]>=3);
      h+='<tr><th class="'+(dead?'dead':'')+'">'+(n===25?'Bull':n)+'</th>'+st.players.map(p=>'<td>'+markSvg(p.marks[n])+'</td>').join('')+'</tr>';}
    return h+'</table>'},
  sum(st,i){const s=st.stat[i];return {darts:s.darts,marks:s.marks,score:st.players[i].score}}
}}
GAMES.cricket=cricketGame('Cricket','Sluit 15 t/m 20 en de bull. Standaard, cut-throat of zonder punten.',[20,19,18,17,16,15,25]);

const HALVE={
  classic:[['15',d=>d.n===15],['16',d=>d.n===16],['Dubbel',d=>d.m===2],['17',d=>d.n===17],['18',d=>d.n===18],['Triple',d=>d.m===3],['19',d=>d.n===19],['20',d=>d.n===20],['Bull',d=>d.n===25]],
  bermuda:[['12',d=>d.n===12],['13',d=>d.n===13],['14',d=>d.n===14],['Dubbel',d=>d.m===2],['15',d=>d.n===15],['16',d=>d.n===16],['17',d=>d.n===17],['Triple',d=>d.m===3],['18',d=>d.n===18],['19',d=>d.n===19],['20',d=>d.n===20],['25',d=>d.n===25],['Bull',d=>d.n===25&&d.m===2]]
};
function halveGame(name,desc,key,start){return {name,desc,min:1,
  opts:[{k:'start',l:'Beginscore',v:[0,40],d:start}],
  create(pl,o){const st=base(pl);st.o=o;st.seq=HALVE[key];st.players.forEach(p=>{p.score=+o.start;p.ti=0});return st},
  begin(st){st.th=0},
  dart(st,d){const p=st.players[st.cur],t=st.seq[p.ti];if(t&&d.m&&t[1](d)){p.score+=val(d);st.th+=val(d)}},
  end(st){const p=st.players[st.cur];if(!st.th){p.score=Math.floor(p.score/2);st.msg='Gehalveerd';}st.hist[st.cur].push(st.th?'+'+st.th:'½');p.ti++;if(p.ti>=st.seq.length)p.out=true},
  big:(st,i)=>st.players[i].score,
  sub(st,i){const p=st.players[i],t=st.seq[p.ti];return t?'Doel '+t[0]+' · '+(p.ti+1)+'/'+st.seq.length:'Klaar'},
  hint(st){const t=st.seq[st.players[st.cur].ti];return t?'Doel: '+t[0]:''},
  targets(st){const t=st.seq[st.players[st.cur].ti];if(!t)return[];const k=t[0];
    if(k==='Dubbel')return SECT.map(n=>({n,m:2}));if(k==='Triple')return SECT.map(n=>({n,m:3}));
    if(k==='Bull')return[{n:25,m:2}];if(k==='25')return[{n:25,m:0}];return[{n:+k,m:0}]},
  sum(st,i){return {darts:st.stat[i].darts,score:st.players[i].score}}
}}

GAMES.killer={name:'Killer',desc:'Raak je eigen dubbel om killer te worden en schiet daarna de levens van je tegenstander weg.',min:2,
  opts:[{k:'lives',l:'Levens',v:[3,5],d:3},{k:'zone',l:'Telt als raak',v:[['double','Alleen dubbel'],['segment','Heel vak (×)']],d:'double'}],
  create(pl,o){const st=base(pl);st.o=o;const r=rng(o.seed||1);const pool=SECT.slice();
    st.players.forEach(p=>{const k=Math.floor(r()*pool.length);p.num=pool.splice(k,1)[0];p.lives=+o.lives;p.killer=false});return st},
  dart(st,d){if(!d.m||d.n===25)return;const p=st.players[st.cur];const cnt=st.o.zone==='double'?(d.m===2?1:0):d.m;if(!cnt)return;
    if(d.n===p.num){if(!p.killer){p.killer=true;st.msg='Killer!'}else{p.lives-=cnt;st.msg='Eigen leven kwijt';if(p.lives<=0){p.lives=0;p.out=p.elim=true;st.done=true}}}
    else if(p.killer){const q=st.players.find(q=>q.num===d.n&&!q.out);if(q){q.lives=Math.max(0,q.lives-cnt);st.msg=q.name+' −'+cnt;if(q.lives<=0)q.out=q.elim=true}}
    const alive=st.players.map((q,i)=>i).filter(i=>!st.players[i].out);
    if(alive.length<=1){st.over=true;st.winner=alive.length?alive[0]:st.cur;st.done=true}},
  end(st){st.hist[st.cur].push(st.tdarts.map(lbl).join(' '))},
  big:(st,i)=>'♥'.repeat(st.players[i].lives)||'—',
  sub(st,i){const p=st.players[i];return 'Nummer '+p.num+(p.killer?' · KILLER':'')},
  hint(st){const p=st.players[st.cur];return p.killer?'Raak de D van je tegenstander':'Raak D'+p.num+' om killer te worden'},
  targets(st){const p=st.players[st.cur];return p.killer?st.players.filter(q=>q!==p&&!q.out).map(q=>({n:q.num,m:st.o.zone==='double'?2:0})):[{n:p.num,m:st.o.zone==='double'?2:0}]},
  sum(st,i){return {darts:st.stat[i].darts,score:st.players[i].lives}}
};

GAMES.gotcha={name:'Gotcha',desc:'Tel op naar precies 301. Gelijk aan je tegenstander? Die gaat terug naar nul.',min:1,
  opts:[{k:'target',l:'Doelscore',v:[301,501],d:301}],
  create(pl,o){const st=base(pl);st.o=o;st.players.forEach(p=>p.score=0);return st},
  begin(st){st.ts=st.players[st.cur].score;st.bust=false},
  dart(st,d){const p=st.players[st.cur],T=+st.o.target,ns=p.score+val(d);
    if(ns>T){p.score=st.ts;st.bust=true;st.done=true;st.msg='Bust';return}
    p.score=ns;st.players.forEach((q,j)=>{if(j!==st.cur&&q.score===ns&&ns>0){q.score=0;st.msg='Gotcha!'}});
    if(ns===T){st.over=true;st.winner=st.cur;st.done=true;st.msg='Gewonnen'}},
  end(st){st.hist[st.cur].push(st.bust?'Bust':String(st.tpts))},
  big:(st,i)=>st.players[i].score,
  sub(st,i){return 'Nog '+(+st.o.target-st.players[i].score)},
  hint(st){return 'Nog '+(+st.o.target-st.players[st.cur].score)+' nodig'},
  targets:()=>[],
  sum(st,i){return {darts:st.stat[i].darts,score:st.players[i].score}}
};

const BOGEY=[169,168,166,165,163,162,159];
GAMES.checkout={name:'Checkout-training',desc:'Willekeurige uitgooien met double out. Negen pijlen per uitgooi.',min:1,
  opts:[{k:'count',l:'Aantal uitgooien',v:[5,10,20],d:10},{k:'range',l:'Bereik',v:[['low','2–60'],['mid','61–100'],['high','101–170'],['all','2–170']],d:'all'}],
  create(pl,o){const st=base(pl);st.o=o;const r=rng(o.seed||7);const rg={low:[2,60],mid:[61,100],high:[101,170],all:[2,170]}[o.range];
    st.list=[];while(st.list.length<+o.count){const v=rg[0]+Math.floor(r()*(rg[1]-rg[0]+1));if(!BOGEY.includes(v))st.list.push(v)}
    st.players.forEach(p=>{p.ci=0;p.rem=st.list[0];p.used=0;p.hits=0;p.score=0});st.stat=pl.map(()=>({darts:0,hits:0,tries:0}));return st},
  begin(st){st.ts=st.players[st.cur].rem;st.solved=false},
  dart(st,d){const p=st.players[st.cur];p.used++;const ns=p.rem-val(d);
    if(ns<0||ns===1||(ns===0&&d.m!==2)){p.rem=st.ts;st.done=true;st.msg='Bust'}
    else{p.rem=ns;if(ns===0){p.hits++;p.score=p.hits;st.stat[st.cur].hits++;st.solved=true;st.done=true;st.msg='Uitgegooid!'}}
    if(p.used>=9)st.done=true},
  end(st){const p=st.players[st.cur];
    if(st.solved||p.used>=9){st.stat[st.cur].tries++;st.hist[st.cur].push((st.solved?'✓ ':'✗ ')+st.list[p.ci]);p.ci++;p.used=0;
      if(p.ci>=st.list.length)p.out=true;else p.rem=st.list[p.ci]}},
  big:(st,i)=>st.players[i].out?'✓':st.players[i].rem,
  sub(st,i){const p=st.players[i];return p.hits+'/'+p.ci+' gehaald · nog '+(9-p.used)+' pijlen'},
  hint(st){const p=st.players[st.cur];const c=st.done?null:checkout(p.rem,Math.min(3-st.td,9-p.used),'double');return c?'Uitgooi: '+c.map(lbl).join(' · '):''},
  targets(st){const p=st.players[st.cur];const c=st.done?null:checkout(p.rem,Math.min(3-st.td,9-p.used),'double');return c?[{n:c[0].n,m:c[0].m}]:[]},
  final(st){bestBy(st,p=>p.hits)},
  sum(st,i){const s=st.stat[i];return {darts:s.darts,hits:s.hits,tries:s.tries,score:s.hits}}
};

const hlN=(n,m)=>[{n,m:m||0}];
// spel met een vaste reeks doelen, één beurt (3 pijlen) per doel
function seqGame(name,desc,cat,targets,pts,extra){extra=extra||{};return {name,desc,cat,min:extra.min||1,opts:extra.opts||[],
  create(pl,o){const st=base(pl);st.o=o;st.T=typeof targets==='function'?targets(o):targets;st.players.forEach(p=>{p.score=extra.start||0;p.ti=0;p.lives=extra.lives||0});st.stat=pl.map(()=>({darts:0,hits:0}));return st},
  begin(st){st.tp=0;st.th=0},
  dart(st,d){const p=st.players[st.cur],t=st.T[p.ti];if(!t)return;const v=pts(d,t,st.td-1,st);if(v){st.tp+=v;st.th++;st.stat[st.cur].hits++;if(!extra.turnOnly)p.score+=extra.sub?-v:v}},
  end(st){const p=st.players[st.cur],t=st.T[p.ti];let v=st.tp;if(extra.turn){v=extra.turn(st,t,p);if(v!=null)p.score+=v}
    st.hist[st.cur].push(t.lab+': '+(extra.histLab?extra.histLab(st,v):v));p.ti++;if(p.ti>=st.T.length)p.out=true},
  final(st){extra.low?bestBy(st,p=>-p.score):bestBy(st,p=>p.score)},
  big:(st,i)=>st.players[i].score,
  sub(st,i){const p=st.players[i],t=st.T[p.ti];return t?'Doel '+t.lab+' · '+(p.ti+1)+'/'+st.T.length:'Klaar'},
  hint(st){const t=st.T[st.players[st.cur].ti];return t?(t.say||('Doel: '+t.lab)):''},
  targets(st){const t=st.T[st.players[st.cur].ti];return t?(t.hl?t.hl(st):t.tg||[]):[]},
  sum(st,i){return {darts:st.stat[i].darts,hits:st.stat[i].hits,score:st.players[i].score}}}}

// voortgangsspel: pas door bij raak (zoals Around the Clock)
function progGame(name,desc,cat,list,extra){extra=extra||{};return {name,desc,cat,min:1,opts:extra.opts||[],
  create(pl,o){const st=base(pl);st.o=o;st.L=list;st.players.forEach(p=>{p.t=0;p.score=0;p.lives=extra.lives||0});st.stat=pl.map(()=>({darts:0,hits:0,fin:0}));return st},
  begin(st){st.th=0},
  dart(st,d){const p=st.players[st.cur],t=st.L[p.t];if(!t||!t.test(d))return;st.th++;st.stat[st.cur].hits++;p.t++;p.score=p.t;
    if(p.t>=st.L.length){st.stat[st.cur].fin=st.stat[st.cur].darts;st.over=true;st.winner=st.cur;st.done=true;st.msg='Klaar!'}},
  end(st){const p=st.players[st.cur];st.hist[st.cur].push(st.th+' raak');
    if(extra.lives&&!st.th){p.lives--;st.msg='Leven kwijt';if(p.lives<=0){p.out=p.elim=true;st.msg='Uit!'}}},
  final(st){bestBy(st,p=>p.t)},
  big(st,i){const p=st.players[i];return p.t>=st.L.length?'✓':st.L[p.t].lab},
  sub(st,i){const p=st.players[i];return p.t+'/'+st.L.length+(extra.lives?' · '+'♥'.repeat(Math.max(0,p.lives)):'')+' · '+st.stat[i].darts+' pijlen'},
  hint(st){const t=st.L[st.players[st.cur].t];return t?'Doel: '+t.lab:''},
  targets(st){const t=st.L[st.players[st.cur].t];return t?t.tg:[]},
  sum(st,i){const s=st.stat[i];return {darts:s.darts,hits:s.hits,fin:s.fin,score:st.players[i].t}}}}

// uitgooi-trainingen
function coGame(name,desc,cat,gen,maxD,points,opts){return {name,desc,cat,min:1,opts:opts||[],
  create(pl,o){const st=base(pl);st.o=o;st.list=gen(o);st.players.forEach(p=>{p.ci=0;p.tgt=st.list[0];p.rem=p.tgt;p.used=0;p.score=0;p.hits=0;p.best=0});st.stat=pl.map(()=>({darts:0,hits:0,tries:0}));return st},
  begin(st){st.ts=st.players[st.cur].rem;st.solved=false},
  dart(st,d){const p=st.players[st.cur];p.used++;const ns=p.rem-val(d);
    if(ns<0||ns===1||(ns===0&&d.m!==2)){p.rem=st.ts;st.done=true;st.msg='Bust'}
    else{p.rem=ns;if(ns===0){const v=points(p.used);p.score+=v;p.hits++;p.best=Math.max(p.best,p.tgt);st.stat[st.cur].hits++;st.solved=true;st.done=true;st.msg='Uitgegooid!'}}
    if(p.used>=maxD)st.done=true},
  end(st){const p=st.players[st.cur];if(st.solved||p.used>=maxD){st.stat[st.cur].tries++;st.hist[st.cur].push((st.solved?'✓ ':'✗ ')+p.tgt);
      p.ci++;p.used=0;if(p.ci>=st.list.length){p.out=true;return}p.tgt=typeof st.list[p.ci]==='function'?st.list[p.ci](p,st.solved):st.list[p.ci];
      if(st.o.ladder){p.tgt=st.solved?p.tgt+1:p.tgt}p.rem=p.tgt}},
  final(st){bestBy(st,p=>p.score)},
  big:(st,i)=>st.players[i].out?'✓':st.players[i].rem,
  sub(st,i){const p=st.players[i];return p.score+' pt · '+(p.ci+1>st.list.length?st.list.length:p.ci+1)+'/'+st.list.length+' · nog '+(maxD-p.used)+' pijlen'},
  hint(st){const p=st.players[st.cur];const c=st.done?null:checkout(p.rem,Math.min(3-st.td,maxD-p.used),'double');return c?'Uitgooi: '+c.map(lbl).join(' · '):''},
  sugg(st){const p=st.players[st.cur];return st.done?null:checkout(p.rem,Math.min(3-st.td,maxD-p.used),'double')},

  SECT.forEach((n,i)=>{const c=90-i*18,a0=c-9,a1=c+9,ev=i%2===0;const sc=ev?'#151515':'#e7dcc0',rc=ev?'#cf3a2d':'#2f8b51';
    s+=`<path d="${ring(RB.bo,RB.ti,a0,a1)}" fill="${sc}"/><path d="${ring(RB.ti,RB.to,a0,a1)}" fill="${rc}"/><path d="${ring(RB.to,RB.di,a0,a1)}" fill="${sc}"/><path d="${ring(RB.di,RB.do,a0,a1)}" fill="${rc}"/>`;
    const [x,y]=P(196,c);s+=`<text x="${x}" y="${y}" fill="#efe8d6" font-family="Big Shoulders Display,Arial Narrow,sans-serif" font-weight="800" font-size="26" text-anchor="middle" dominant-baseline="central">${n}</text>`;});
  s+=`<circle r="${RB.bo}" fill="#2f8b51"/><circle r="${RB.bi}" fill="#cf3a2d"/>`;
  s+=`<g fill="none" stroke="#b9b6aa" stroke-width=".8" opacity=".7">`;
  [RB.bi,RB.bo,RB.ti,RB.to,RB.di,RB.do].forEach(r=>s+=`<circle r="${r}"/>`);
  for(let i=0;i<20;i++){const a=90-i*18+9;s+=`<line x1="${P(RB.bo,a)[0]}" y1="${P(RB.bo,a)[1]}" x2="${P(RB.do,a)[0]}" y2="${P(RB.do,a)[1]}"/>`}
  s+=`</g><g class="hl"></g><g class="marks"></g></svg>`;return s;
}
function hlPaths(targets){let s='';for(const t of targets){
  if(t.n===25){s+=`<circle r="${t.m===2?RB.bi:RB.bo}" fill="#e1ae4a" fill-opacity=".45" stroke="#e1ae4a" stroke-width="2"/>`;continue}
  const i=SECT.indexOf(t.n);if(i<0)continue;const c=90-i*18;
  const [r1,r2]=t.m===3?[RB.ti,RB.to]:t.m===2?[RB.di,RB.do]:t.m===1?[RB.to,RB.di]:[RB.bo,RB.do];
  s+=`<path d="${ring(r1,r2,c-9,c+9)}" fill="#e1ae4a" fill-opacity="${t.m?'.55':'.28'}" stroke="#e1ae4a" stroke-width="2"/>`;}return s}
function svgToMM(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());return [p.x,-p.y]}

function startMatch(game,pl,opts,input){
  opts=Object.assign({},opts,{seed:Math.floor(Math.random()*1e9)});
  MATCH={id:uid(),game,opts,players:pl.map(p=>({id:p.id,name:p.name})),turns:[],input,saved:false,date:new Date().toISOString(),online:!!(ONLINE.open&&ONLINE.guestId&&pl.some(p=>p.id===ONLINE.guestId))};
  ST=runMatch(MATCH);MULT=1;
  if(input==='cam'){startAllCams().then(async()=>{if(!activeCams().length&&CAMRT.some(r=>r.stream)){toast('Camera\'s kalibreren…');await autoCalAll()}resetRefs();DET.active=true;renderGame()});}
  renderGame();
}
function curTurn(){return MATCH.turns[MATCH.turns.length-1]}
function addDart(d){
  if(!MATCH||MATCH.saved||ST.over)return;
  let t=curTurn();
  if(!t||t.closed){t={darts:[],closed:false};MATCH.turns.push(t)}
  else if(ST.done){t.closed=true;afterClose();t={darts:[],closed:false};MATCH.turns.push(t)}
  t.darts.push(d);refresh();fxDart(d);
  if(ST.msg==='Bust'){say('Bust');callout('Bust','bust')}
  else if(ST.msg&&ST.msg!=='Game shot')callout(ST.msg,'high');
}
function nextTurn(){
  if(!MATCH||ST.over)return;const t=curTurn();if(!t||t.closed||!t.darts.length)return;
  while(!ST.done&&t.darts.length<3){t.darts.push({n:0,m:0});ST=runMatch(MATCH)}
  t.closed=true;afterClose();refresh();
}
function afterClose(){
  // stem: X01-beurtscore
  const before=ST; fxTurn(before); if(MATCH.game==='x01'&&!before.bust){if(before.leg)say('Game shot');else say(String(before.sc));}
}
function undo(){
  if(!MATCH||MATCH.saved)return;let t=curTurn();
  if(t&&!t.darts.length){MATCH.turns.pop();t=curTurn()}
  if(!t)return;t.closed=false;t.darts.pop();if(!t.darts.length)MATCH.turns.pop();
  refresh();
}
function refresh(){ST=runMatch(MATCH);if(ST.over)finishMatch();renderGame()}
function finishMatch(){
  if(MATCH.saved)return;const G=GAMES[MATCH.game];
  const rec={id:MATCH.id,date:MATCH.date,game:MATCH.game,opts:MATCH.opts,
    pids:MATCH.players.map(p=>p.id),names:MATCH.players.map(p=>p.name),winner:ST.winner!=null?MATCH.players[ST.winner].id:null,
    sum:MATCH.players.map((p,i)=>G.sum(ST,i)),
    hits:ST.darts.map(d=>[d.p,d.n,d.m,Math.round((d.x??0)*10)/10,Math.round((d.y??0)*10)/10]),
    turns:MATCH.turns.map(t=>t.darts.map(d=>[d.n,d.m]))};
  DB.matches.push(rec);save();MATCH.saved=true;DET.active=false;onlineSync(true);
  say((ST.winner!=null?MATCH.players[ST.winner].name+' wint':'Einde spel'));
  showResult(rec);
}
function showResult(rec){
  const G=GAMES[rec.game];
  const rows=x01Rows(rec)||genericRows(rec);
  $('#overlay').innerHTML=`<div class="ov"><div class="box stack">
    <div><div class="muted small">${G.name} afgelopen</div><p class="win">${rec.winner?esc(rec.names[rec.pids.indexOf(rec.winner)])+' wint':'Klaar'}</p></div>
    <div class="tw"><table class="t"><tr><th></th>${rec.names.map(n=>'<th>'+esc(n)+'</th>').join('')}</tr>${rows}</table></div>
    <div class="small muted">Opgeslagen in je statistieken.</div>
    <div class="row"><button class="btn primary" id="again">Nog een keer</button><button class="btn" id="tomenu">Naar menu</button><button class="btn" id="tostats">Statistieken</button></div></div></div>`;
  $('#again').onclick=()=>{$('#overlay').innerHTML='';const pl=MATCH.players.slice().reverse();const o=Object.assign({},MATCH.opts);startMatch(MATCH.game,pl,o,MATCH.input)};
  $('#tomenu').onclick=()=>{$('#overlay').innerHTML='';MATCH=null;GDOM=null;renderSetup()};
  $('#tostats').onclick=()=>{$('#overlay').innerHTML='';MATCH=null;show('stats')};
}
function x01Rows(rec){if(rec.game!=='x01')return null;const S=rec.sum;const r=(l,f)=>'<tr><td>'+l+'</td>'+S.map(s=>'<td class="num">'+f(s)+'</td>').join('')+'</tr>';
  return r('Gemiddelde',s=>avg3(s.pts,s.darts))+r('First 9',s=>avg3(s.f9p,s.f9d))+r('Checkout',s=>s.coAtt?Math.round(s.coHit/s.coAtt*100)+'% ('+s.coHit+'/'+s.coAtt+')':'–')+r('Hoogste uitgooi',s=>s.hiCo||'–')+r('180 / 140+ / 100+',s=>s.s180+' / '+s.s140+' / '+s.s100)+r('Legs',s=>s.legs)+r('Beste leg',s=>s.best?s.best+' pijlen':'–')+r('Pijlen',s=>s.darts)}
function genericRows(rec){const S=rec.sum;const r=(l,f)=>'<tr><td>'+l+'</td>'+S.map(s=>'<td class="num">'+f(s)+'</td>').join('')+'</tr>';
  let h=r('Score',s=>s.score??'–')+r('Pijlen',s=>s.darts);
  if(S[0].marks!=null)h+=r('MPR',s=>s.darts?(s.marks/s.darts*3).toFixed(2):'–');
  if(S[0].hits!=null)h+=r('Raak',s=>s.hits+(s.darts?' ('+Math.round(s.hits/s.darts*100)+'%)':''));
  if(S[0].tries!=null)h+=r('Uitgooien gehaald',s=>s.hits+'/'+s.tries);
  return h}

function tween(el,to){
  const num=typeof to==='number'||/^-?\d+$/.test(String(to));
  if(!num||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;el._v=num?+to:null;return}
  to=+to;const from=el._v;el._v=to;if(from==null||from===to){el.textContent=to;return}
  const t0=performance.now(),D=Math.min(700,250+Math.abs(to-from)*3);cancelAnimationFrame(el._raf);
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step)};el._raf=requestAnimationFrame(step);
}
function sparkPath(h){const v=h.map(x=>parseInt(x,10)).filter(x=>!isNaN(x)).slice(-12);if(v.length<2)return '';
  const mx=Math.max(...v,1),X=i=>i*120/(v.length-1),Y=x=>28-x/mx*24;const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join('');
  return `<path d="${d}L120 30L0 30Z" fill="var(--gold)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="2.4" fill="var(--gold)"/>`}
function updateGame(G){
  const cards=$$('#groot .pc');const x01=MATCH.game==='x01';
  ST.players.forEach((p,i)=>{const c=cards[i];if(!c)return;const on=i===ST.cur&&!ST.over;
    c.classList.toggle('on',on);c.classList.toggle('out',!!p.out);
    $('.tag',c).textContent=ST.winner===i?'Winnaar':p.elim?'Uit':p.out?'Klaar':'';
    tween($('.big',c),G.big(ST,i));
    const legs=$('.legs',c);legs.textContent=x01?p.legs:'';legs.hidden=!x01;
    const s=ST.stat[i];
    $('.pc-sub',c).innerHTML=x01?`Leg <b>${p.ld?(p.lp/p.ld*3).toFixed(1):'0.0'}</b> / Match <b>${avg3(s.pts,s.darts)}</b>`:esc(G.sub(ST,i));
    $('.pc-darts',c).innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 3l7 7M9 9l11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="3.5" cy="3.5" r="2" fill="currentColor"/></svg> ${x01?p.ld:s.darts}`;
    // uitgooiroute naast de score van de speler aan de beurt
    let co=null;if(on&&!ST.done&&G.sugg)co=G.sugg(ST);
    $('.co',c).innerHTML=co?co.map(d=>`<span>${lbl(d)}</span>`).join(''):'';
    // voortgangsbalk
    let frac=0;if(x01)frac=1-p.score/+ST.o.start;else if(p.ti!=null&&ST.T)frac=p.ti/ST.T.length;else if(p.t!=null&&(ST.L||G===GAMES.atc))frac=p.t/(ST.L?ST.L.length:21);else if(p.turns!=null&&ST.o.rounds)frac=p.turns/+ST.o.rounds;else if(p.ci!=null&&ST.list)frac=p.ci/ST.list.length;
    $('.prog i',c).style.width=Math.max(0,Math.min(1,frac))*100+'%';
    $('.spark',c).innerHTML=sparkPath(ST.hist[i]);
    $('.hist',c).innerHTML=ST.hist[i].slice(-5).map(h=>'<span>'+esc(h)+'</span>').join('');});
  if(GDOM.prevCur!==ST.cur&&cards[ST.cur]){cards[ST.cur].classList.remove('enter');void cards[ST.cur].offsetWidth;cards[ST.cur].classList.add('enter');GDOM.prevCur=ST.cur}
  // beurtbalk
  const tb=$$('#tbd .tbs');tb.forEach((el,k)=>{const d=ST.tdarts[k];const txt=d?lbl(d):'';if(el.dataset.t!==txt){el.dataset.t=txt;

      if(best&&best.d<.4){DB.cams[i].pts=best.P;DB.cams[i].autoQ=Math.round(res.score*100);setupCalib(i);okN++;msgs[i]=`Opnieuw gekalibreerd (${DB.cams[i].autoQ}% match). De richting van de 20 is behouden.`;continue}}
    if(res.ok){DB.cams[i].pts=res.pts;DB.cams[i].autoQ=Math.round(res.score*100);DB.cams[i].need20=true;setupCalib(i);okN++;msgs[i]=`Bord gevonden (${DB.cams[i].autoQ}% match). Haal alle pijlen uit het bord en gooi dan één pijl in de 20, zodat de app de richting vastlegt.`+(res.score<.7?' De match is aan de lage kant: meer licht helpt.':'')}

   <div class="stack">
    <div class="box stack"><h3>Algemeen${SF.game!=='all'?' · '+gameNames[SF.game]:''}</h3><div class="tiles">${tile(ms.length,'Potten')}${tile(won,'Gewonnen')}${tile(ms.length?Math.round(won/ms.length*100)+'%':'–','Winst %')}${tile(ms.reduce((s,m)=>s+(m.sum[idx(m)].darts||0),0),'Pijlen gegooid')}</div></div>
    ${x.length?`<div class="box stack"><h3>X01</h3><div class="tiles">${tile(avg3(agg('pts'),agg('darts')),'3-pijl gemiddelde')}${tile(avg3(agg('f9p'),agg('f9d')),'First 9')}${tile(agg('coAtt')?Math.round(agg('coHit')/agg('coAtt')*100)+'%':'–','Checkout %')}${tile(Math.max(0,...x.map(a=>a.hiCo||0))||'–','Hoogste uitgooi')}${tile(agg('s180'),'180\'s')}${tile(agg('s140'),'140+')}${tile(agg('s100'),'100+')}${tile(Math.min(...x.filter(a=>a.best).map(a=>a.best).concat([Infinity]))===Infinity?'–':Math.min(...x.filter(a=>a.best).map(a=>a.best)),'Beste leg (pijlen)')}${tile(agg('legs'),'Legs gewonnen')}</div>
      <div class="chart">${avgChart(all.filter(m=>m.game==='x01').slice(-40).map(m=>{const s=m.sum[idx(m)];return s.darts?s.pts/s.darts*3:0}))}</div></div>`:''}
    ${cr.length?`<div class="box stack"><h3>Cricket &amp; Tactics</h3><div class="tiles">${tile(mpr,'Marks per ronde')}${tile(cr.length,'Potten')}</div></div>`:''}
    <div class="sgrid">
      <div class="box stack"><h3>Per spel</h3><div class="tw"><table class="t"><tr><th>Spel</th><th>Potten</th><th>Gewonnen</th><th>Beste</th><th>Gem. score</th><th>Raak %</th></tr>${perGame||'<tr><td colspan="6" class="muted">Nog niets gespeeld</td></tr>'}</table></div></div>
      <div class="box stack"><h3>Waar je pijlen landen</h3><div class="boardwrap" style="max-width:380px;margin:0 auto">${boardSVG('hboard')}</div><div class="small muted" id="topsegs"></div></div>
    </div>
    <div class="box stack"><h3>Alle potten</h3><div class="tw"><table class="t"><tr><th>Datum</th><th>Spel</th><th>Spelers</th><th>Winnaar</th><th>Kerncijfer</th><th></th></tr>
     ${ms.slice().reverse().map(m=>{const s=m.sum[idx(m)];const key=m.game==='x01'?'Gem. '+avg3(s.pts,s.darts):s.marks!=null?'MPR '+(s.darts?(s.marks/s.darts*3).toFixed(2):'0'):'Score '+(s.score??'–');
       return `<tr><td>${new Date(m.date).toLocaleString('nl-NL',{dateStyle:'short',timeStyle:'short'})}</td><td>${gameNames[m.game]||m.game}${m.game==='x01'?' '+m.opts.start:''}</td><td>${m.names.map(esc).join(' – ')}</td><td>${m.winner?esc(m.names[m.pids.indexOf(m.winner)]):'–'}</td><td class="num">${key}</td><td><button class="btn danger" data-del="${m.id}" style="padding:4px 10px">Verwijderen</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Geen potten</td></tr>'}</table></div></div>
   </div>`;
  $('#spid').onchange=e=>{SF.pid=e.target.value;renderStats()};$('#sgame').onchange=e=>{SF.game=e.target.value;renderStats()};
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oche-darts-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);let n=0;
    (d.players||[]).forEach(p=>{if(!DB.players.find(q=>q.id===p.id))DB.players.push(p)});(d.matches||[]).forEach(m=>{if(!DB.matches.find(q=>q.id===m.id)){DB.matches.push(m);n++}});
    DB.matches.sort((a,b)=>a.date<b.date?-1:1);save();toast(n+' potten geïmporteerd');renderStats()}catch(err){toast('Dit bestand kan ik niet lezen: '+err.message)}};r.readAsText(f)};
  $$('[data-del]').forEach(b=>b.onclick=()=>confirmBox('Deze pot verwijderen uit de statistieken?','Verwijderen',()=>{DB.matches=DB.matches.filter(m=>m.id!==b.dataset.del);save();renderStats()}));
  // heatmap
  const hs=[];ms.forEach(m=>{const k=idx(m);(m.hits||[]).forEach(h=>{if(h[0]===k&&h[2])hs.push(h)})});
  const recent=hs.slice(-800);$('#hboard .marks').innerHTML=recent.map(h=>`<circle cx="${h[3]+(Math.random()-.5)*4}" cy="${-h[4]+(Math.random()-.5)*4}" r="3.2" fill="#e1ae4a" fill-opacity=".45"/>`).join('');
  const cnt={};hs.forEach(h=>{const l=lbl({n:h[1],m:h[2]});cnt[l]=(cnt[l]||0)+1});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('#topsegs').textContent=hs.length?'Meest geraakt: '+top.map(([l,c])=>l+' ('+Math.round(c/hs.length*100)+'%)').join(' · '):'Nog geen pijlen met een plek op het bord.';
}
function avgChart(vals){
  if(vals.length<2)return '<div class="small muted">De grafiek verschijnt vanaf twee X01-potten.</div>';
  const W=640,H=200,pl=36,pr=12,pt=12,pb=26;const lo=Math.floor(Math.min(...vals)/10)*10,hi=Math.max(lo+10,Math.ceil(Math.max(...vals)/10)*10);
  const X=i=>pl+i*(W-pl-pr)/(vals.length-1),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const step=(hi-lo)>60?20:10;let g='';for(let v=lo;v<=hi;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2c342e"/><text x="${pl-6}" y="${Y(v)}" fill="#a5a08c" font-size="11" text-anchor="end" dominant-baseline="central">${v}</text>`;
  const d=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  const area=d+`L${X(vals.length-1)} ${H-pb}L${X(0)} ${H-pb}Z`;const L=vals.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="3-pijl gemiddelde per X01-pot">${g}<path d="${area}" fill="#e1ae4a" fill-opacity=".12"/><path d="${d}" fill="none" stroke="#e1ae4a" stroke-width="2.2"/><circle cx="${X(L)}" cy="${Y(vals[L])}" r="4.5" fill="#e1ae4a"/><text x="${X(L)-8}" y="${Y(vals[L])-12}" fill="#efe8d6" font-size="12" font-weight="700" text-anchor="end">${vals[L].toFixed(1)}</text><text x="${pl}" y="${H-6}" fill="#a5a08c" font-size="11">Gemiddelde per pot, laatste ${vals.length}</text></svg>`;
}

// ---------- Spelers ----------
function renderPlayers(){
  $('#v-players').innerHTML=`<h2>Spelers</h2><div class="plist">${DB.players.map(p=>`<div class="prow"><input type="text" value="${esc(p.name)}" data-id="${p.id}" aria-label="Naam"><span class="small muted">${DB.matches.filter(m=>m.pids.includes(p.id)).length} potten</span><button class="btn danger" data-rm="${p.id}">Verwijderen</button></div>`).join('')||'<div class="muted">Nog geen spelers. Een naam die je bij een spel invult, komt hier vanzelf bij.</div>'}
    <div class="prow"><input type="text" id="newp" placeholder="Nieuwe speler"><button class="btn primary" id="addp">Toevoegen</button></div></div>`;
  $$('[data-id]').forEach(i=>i.onchange=()=>{const p=DB.players.find(p=>p.id===i.dataset.id);const n=i.value.trim();if(!n)return;p.name=n;DB.matches.forEach(m=>{const k=m.pids.indexOf(p.id);if(k>=0)m.names[k]=n});save();toast('Naam opgeslagen')});
  $$('[data-rm]').forEach(b=>b.onclick=()=>confirmBox('Speler verwijderen? De gespeelde potten blijven bewaard.','Verwijderen',()=>{DB.players=DB.players.filter(p=>p.id!==b.dataset.rm);save();renderPlayers()}));
  $('#addp').onclick=()=>{const n=$('#newp').value.trim();if(n){playerByName(n);renderPlayers()}};
}

// start
CAMRT.forEach((r,i)=>setupCalib(i));
updateChip();renderPlay();
</script>
